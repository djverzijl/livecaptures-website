<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#12181d"/>
      <stop offset="1" stop-color="#0a0d10"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- aperture ring: four blades rotated around center, reads as a lens/shutter -->
  <g transform="translate(256,256)">
    <g stroke="none">
      <path d="M0,-118 A118,118 0 0,1 102.2,-59 L54,-31 A62,62 0 0,0 0,-62 Z" fill="#8fc0dd"/>
      <path d="M102.2,-59 A118,118 0 0,1 102.2,59 L54,31 A62,62 0 0,0 54,-31 Z" fill="#6fa8c9"/>
      <path d="M102.2,59 A118,118 0 0,1 0,118 L0,62 A62,62 0 0,0 54,31 Z" fill="#4f8bad"/>
      <path d="M0,118 A118,118 0 0,1 -102.2,59 L-54,31 A62,62 0 0,0 0,62 Z" fill="#3a7191"/>
      <path d="M-102.2,59 A118,118 0 0,1 -102.2,-59 L-54,-31 A62,62 0 0,0 -54,31 Z" fill="#2e6f95"/>
      <path d="M-102.2,-59 A118,118 0 0,1 0,-118 L0,-62 A62,62 0 0,0 -54,-31 Z" fill="#255c7c"/>
    </g>
    <!-- live dot, off-axis: the aperture is mid-capture -->
    <circle cx="0" cy="0" r="16" fill="#f5f6f7"/>
  </g>
</svg>
