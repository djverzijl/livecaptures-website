<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:820px;height:312px;background:#1D6FE0;overflow:hidden;}

  .content{position:relative;z-index:1;display:flex;align-items:center;gap:24px;padding-left:56px;}
  svg.mark{width:84px;height:84px;flex-shrink:0;}
  .text h1{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:38px;color:#ffffff;letter-spacing:.01em;line-height:1.05;margin:0;}
  .text p{font-family:'Epilogue',sans-serif;font-weight:500;font-size:16px;color:#dcebff;margin:10px 0 0;max-width:520px;line-height:1.4;}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="Facebook banner">
  <svg class="ghost" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <g transform="translate(256,256)">
      <g stroke="none" fill="#ffffff">
        <path d="M0,-118 A118,118 0 0,1 102.2,-59 L54,-31 A62,62 0 0,0 0,-62 Z"/>
        <path d="M102.2,-59 A118,118 0 0,1 102.2,59 L54,31 A62,62 0 0,0 54,-31 Z"/>

        <path d="M-102.2,-59 A118,118 0 0,1 0,-118 L0,-62 A62,62 0 0,0 -54,-31 Z"/>
      </g>
    </g>
  </svg>
  <div class="content">
    <svg class="mark" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="120" fill="#ffffff"/>
      <g transform="translate(256,256)">
        <g stroke="none">
          <path d="M0,-118 A118,118 0 0,1 102.2,-59 L54,-31 A62,62 0 0,0 0,-62 Z" fill="#1D6FE0"/>
          <path d="M102.2,-59 A118,118 0 0,1 102.2,59 L54,31 A62,62 0 0,0 54,-31 Z" fill="#4c8fef"/>

          <path d="M-102.2,59 A118,118 0 0,1 -102.2,-59 L-54,-31 A62,62 0 0,0 -54,31 Z" fill="#79aaf3"/>
          <path d="M-102.2,-59 A118,118 0 0,1 0,-118 L0,-62 A62,62 0 0,0 -54,-31 Z" fill="#4c8fef"/>
        </g>
        <circle cx="0" cy="0" r="16" fill="#1D6FE0"/>

    </svg>
    <div class="text">
      <h1>LiveCaptures</h1>
      <p>Live fotogalerij tijdens je shoot — camera → bewerkt → online, terwijl jij nog fotografeert.</p>
