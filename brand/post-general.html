<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Epilogue:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;width:1080px;height:1350px;background:#F6F3EC;}
  .page{width:1080px;height:1350px;background:#F6F3EC;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;font-family:'Epilogue',sans-serif;}
  .eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:36px;}
  .eyebrow svg{width:34px;height:34px;}
  .eyebrow span{font-family:'Epilogue',sans-serif;font-weight:700;font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:#7a7264;}
  h1{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;font-size:88px;line-height:1.05;color:#1D6FE0;text-align:center;margin:0 0 30px;max-width:820px;}
  .divider{width:120px;height:5px;background:#1D6FE0;border-radius:3px;margin-bottom:30px;}
  p{font-family:'Epilogue',sans-serif;font-weight:500;font-size:30px;color:#3a352e;text-align:center;max-width:760px;line-height:1.45;margin:0;}
</style>
</head>
<body>
<div class="page" data-document-role="page" data-label="Live galerij tijdens de shoot">
  <div class="eyebrow">
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="120" fill="#1D6FE0"/>
      <g transform="translate(256,256)"><g stroke="none">
        <path d="M0,-118 A118,118 0 0,1 102.2,-59 L54,-31 A62,62 0 0,0 0,-62 Z" fill="#ffffff"/>
        <path d="M102.2,-59 A118,118 0 0,1 102.2,59 L54,31 A62,62 0 0,0 54,-31 Z" fill="#dcebff"/>
        <path d="M102.2,59 A118,118 0 0,1 0,118 L0,62 A62,62 0 0,0 54,31 Z" fill="#bcd8fb"/>
        <path d="M0,118 A118,118 0 0,1 -102.2,59 L-54,31 A62,62 0 0,0 0,62 Z" fill="#9cc4f4"/>
        <path d="M-102.2,59 A118,118 0 0,1 -102.2,-59 L-54,-31 A62,62 0 0,0 -54,31 Z" fill="#bcd8fb"/>
        <path d="M-102.2,-59 A118,118 0 0,1 0,-118 L0,-62 A62,62 0 0,0 -54,-31 Z" fill="#dcebff"/>
      </g><circle cx="0" cy="0" r="16" fill="#ffffff"/></g>
    </svg>
    <span>LiveCaptures</span>
  </div>
  <h1>Foto's tijdens de shoot</h1>
  <div class="divider"></div>
  <p>De galerij update binnen seconden, zodat gasten de foto's tijdens het evenement direct kunnen zien. Deelbaar via link of QR-code.</p>
</div>
</body>
</html>
